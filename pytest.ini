[pytest]
# tests/ is not a package and src/ is not either - the scripts import each other
# by bare module name, and tests/conftest.py puts src/ on sys.path. Nothing here
# changes that; this file exists so that `python -m pytest` from the project root
# finds the tests, registers the one marker they use, and does not warn about it.
testpaths = tests
markers =
    slow: reads the NHANES XPT files or a results JSON, so it needs the data present
addopts = -q --strict-markers
